<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soch Automation Diagnostic — Local Dev</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0d0d0d;
        color: #f5efe0;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 24px;
      }
      h1 { font-weight: 600; margin: 0 0 12px; }
      p { color: #aaa; line-height: 1.6; }
      code { background: #1a1a1a; padding: 2px 6px; border-radius: 4px; color: #ea6a47; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Soch Automation Diagnostic</h1>
      <p>This is the local dev harness. The widget should be visible in the bottom-right corner.</p>
      <p>Embed on any site with:</p>
      <p><code>&lt;link rel="stylesheet" href="https://your-domain.com/widget.css"&gt;</code></p>
      <p><code>&lt;script src="https://your-domain.com/widget.js" defer&gt;&lt;/script&gt;</code></p>
    </div>
    <link rel="stylesheet" href="/widget.css" />
    <script src="/widget.js" defer></script>
  </body>
</html>
